<!DOCTYPE html>
<html>
<head>
  <title>Library System</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; background: #f4f6f8; }
    nav { background: #0f3b4d; padding: 15px; }
    nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
    .container { padding: 20px; background: white; margin: 20px; border-radius: 8px; }
    button, input[type="submit"] { background: #00a8e8; color: white; border: none; padding: 8px 15px; cursor: pointer; }
    input[type="text"] { padding: 8px; width: 250px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/books">Book List</a>
    <a href="/add_book">Add Book</a>
    <a href="/loans">Borrowed Books</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <p style="background:#d4edda; padding:10px;">{{ m }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
