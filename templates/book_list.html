{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <h2 style="font-size:24px; font-weight:700; color:#2c1a4a;">Browse Book Catalog</h2>
    <a href="/add-book" class="btn">+ Add New Book</a>
</div>

<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:20px;">
{% for book in books %}
  <div style="border:1px solid #eae2f5; border-radius:16px; overflow:hidden; background:white; box-shadow:0 4px 15px rgba(55, 35, 85, 0.04); transition: transform 0.2s;">

    {% if 'Noli' in book.title %}
      <img src="https://covers.openlibrary.org/b/title/Noli%20Me%20Tangere-L.jpg"
           onerror="this.onerror=null; this.src='https://covers.openlibrary.org/b/isbn/9789712711502-L.jpg';"
           style="width:100%; height:260px; object-fit:cover;">

    {% elif 'Fili' in book.title %}
      <img src="https://covers.openlibrary.org/b/title/El%20Filibusterismo-L.jpg"
           onerror="this.onerror=null; this.src='https://covers.openlibrary.org/b/isbn/9789712711519-L.jpg';"
           style="width:100%; height:260px; object-fit:cover;">

    {% elif 'Harry' in book.title %}
      <img src="https://upload.wikimedia.org/wikipedia/en/6/6b/Harry_Potter_and_the_Philosopher%27s_Stone_Book_Cover.jpg"
           style="width:100%; height:260px; object-fit:cover;">

    {% else %}
      <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80" style="width:100%; height:260px; object-fit:cover;">
    {% endif %}

    <div style="padding:16px;">
      <div style="font-weight:700; font-size:15px; color:#2c1a4a; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ book.title }}</div>
      <div style="color:#776892; font-size:12px; margin:6px 0 14px 0;">{{ book.author }}</div>
      <div style="display:flex; gap:8px;">
        <a href="/borrow/{{ book.id }}" style="flex:1; text-align:center; background:#1b7a43; color:white; padding:8px; border-radius:10px; text-decoration:none; font-size:12px; font-weight:700;">Borrow</a>
        <a href="/edit/{{ book.id }}" style="padding:8px 12px; border:1px solid #dcd1ec; border-radius:10px; text-decoration:none; font-size:12px; color:#4a386d; font-weight:600;">Edit</a>
      </div>
    </div>
  </div>
{% endfor %}
</div>
{% endblock %}
