{% extends "base.html" %}
{% block content %}
<h2>Book List</h2>

<form method="get" action="/books" style="margin-bottom: 15px;">
  <input type="text" name="q" placeholder="Search by title or author..." value="{{ q }}">
  <button type="submit">Search</button>
  {% if q %}
  <a href="/books">Clear</a>
  {% endif %}
</form>

{% if books %}
<table border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse: collapse;">
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Author</th>
    <th>Action</th>
  </tr>
  {% for book in books %}
  <tr>
    <td>{{ book.id }}</td>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
    <td>
      <a href="/borrow/{{ book.id }}">Borrow</a> |
      <a href="/edit/{{ book.id }}">Edit</a> |
      <a href="/delete/{{ book.id }}" onclick="return confirm('Delete this book?')">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>No books found.</p>
{% endif %}
{% endblock %}
