{% extends "base.html" %}
{% block content %}
<h1>Book List</h1>
<form method="GET" action="/books">
    <input type="text" name="search" placeholder="Search book..." value="{{ search }}">
    <button type="submit">Search</button>
</form>
<br>
<table>
    <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Action</th></tr>
    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.isbn }}</td>
        <td><a href="/edit/{{ book.id }}"><button>Edit</button></a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
