{% extends "base.html" %}

{% block content %}
<div class="section-card" style="max-width: 600px;">
    <h2 class="section-title">👥 Add New Member</h2>

    <form method="POST" action="{{ url_for('add_member') }}">
        <div>
            <label>Full Name:</label>
            <input type="text" name="name" placeholder="Enter full name" required>
        </div>

        <div>
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="Enter email address" required>
        </div>

        <div>
            <label>Phone Number:</label>
            <input type="text" name="phone" placeholder="Enter phone number" required>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button type="submit" class="btn">Save Member</button>
            <a href="{{ url_for('index') }}" class="btn" style="background:#e4dcf4; color:#4a386d; text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
