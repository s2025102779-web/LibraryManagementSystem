{% extends "base.html" %}
{% block content %}

<div class="section-card" style="max-width: 600px;">
    <h2 class="section-title">➕ Add New Book</h2>

    <form method="POST" action="{{ url_for('add_book') }}">
        <div>
            <label>Title:</label>
            <input type="text" name="title" placeholder="Ex: Noli Me Tangere" required>
        </div>

        <div>
            <label>Author:</label>
            <input type="text" name="author" placeholder="Ex: Jose Rizal" required>
        </div>

        <div>
            <label>ISBN:</label>
            <input type="text" name="isbn" placeholder="Ex: 978-971-07-1234-5" required>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button type="submit">Save Book</button>
            <a href="{{ url_for('index') }}" class="btn" style="background:#e4dcf4; color:#4a386d; text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
